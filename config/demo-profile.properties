# Phase 5 desktop demo profile. Copy this file and replace map.file plus LAN IPs as needed.
# It intentionally contains no password, API key, personal path, or secret.
profile.name=three-computer-lan-template
profile.threeComputerLan=true

base.nodeId=BASE-01
base.bindHost=192.168.43.103
base.port=18888
base.peerHost=192.168.43.102
base.peerPort=18002

relay.nodeId=RELAY-01
relay.bindHost=192.168.43.102
relay.port=18002
relay.peerHost=192.168.43.103
relay.peerPort=18888

victim.nodeId=VICTIM-01
victim.bindHost=192.168.43.101
victim.port=18001
victim.peerHost=192.168.43.102
victim.peerPort=18002

# Replace with a valid MBTiles file before the demo. Relative paths are based on this file.
map.file=replace-with-demo.mbtiles
retry.maxAttempts=5
retry.initialDelayMs=1000
retry.maxDelayMs=16000
