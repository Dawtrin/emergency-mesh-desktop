<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Mesh Rescue — Tactical Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* ── Dark Tactical Map Styling ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #121214;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #121214;
        }

        /* ── CSS Dark Mode Filter cho mọi Tile Layer (Đảm bảo luôn tối và không bị ô trắng) ── */
        .dark-tiles .leaflet-tile {
            filter: brightness(0.65) invert(1) contrast(3.5) hue-rotate(200deg) saturate(0.25) brightness(0.65);
        }

        /* Tactical Grid nền khi tile đang tải */
        .leaflet-container {
            background-color: #121214 !important;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px) !important;
            background-size: 20px 20px !important;
        }

        /* Override Leaflet controls for dark theme */
        .leaflet-control-zoom a {
            background-color: rgba(28, 28, 30, 0.95) !important;
            color: #0A84FF !important;
            border: 1px solid rgba(255,255,255,0.12) !important;
            border-radius: 8px !important;
            font-weight: bold !important;
        }
        .leaflet-control-zoom a:hover {
            background-color: rgba(44, 44, 46, 1.0) !important;
            color: #FFFFFF !important;
        }
        .leaflet-control-zoom {
            border: none !important;
            border-radius: 10px !important;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5) !important;
        }

        .leaflet-control-attribution {
            background: rgba(18, 18, 20, 0.85) !important;
            color: #8E8E93 !important;
            font-size: 10px !important;
            border-top-left-radius: 6px;
            padding: 2px 6px !important;
        }
        .leaflet-control-attribution a {
            color: #0A84FF !important;
            text-decoration: none;
        }

        /* Custom popup styling — iOS 27 Glassmorphism */
        .leaflet-popup-content-wrapper {
            background: rgba(28, 28, 30, 0.96) !important;
            color: #FFFFFF !important;
            border-radius: 16px !important;
            box-shadow: 0 12px 36px rgba(0,0,0,0.7) !important;
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
        }
        .leaflet-popup-tip {
            background: rgba(28, 28, 30, 0.96) !important;
        }
        .leaflet-popup-close-button {
            color: #8E8E93 !important;
            padding: 8px 8px 0 0 !important;
        }
        .leaflet-popup-content {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            margin: 12px 14px !important;
        }

        /* SOS Popup inner styling */
        .sos-popup {
            min-width: 200px;
        }
        .sos-popup h3 {
            margin: 0 0 8px 0;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sos-popup .critical { color: #FF453A; }
        .sos-popup .high { color: #FF9F0A; }
        .sos-popup .medium { color: #FFD60A; }
        .sos-popup .info-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .sos-popup .info-label {
            color: #8E8E93;
            font-size: 12px;
        }
        .sos-popup .info-value {
            font-weight: 600;
            font-size: 13px;
            color: #FFFFFF;
        }

        /* Pulse animation for CRITICAL markers */
        @keyframes pulse-sos {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.8); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(255, 59, 48, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .pulse-marker-sos {
            animation: pulse-sos 1.4s ease-out infinite;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // ═══════════════════════════════════════════════════════════
    //  BẢN ĐỒ TÁC CHIẾN TỰ ĐỘNG DỰ PHÒNG TILE LAYER (FALLBACK)
    // ═══════════════════════════════════════════════════════════

    // ── Khởi tạo bản đồ trung tâm: Trường ĐH CNTT&TT Việt - Hàn (VKU) — 15.9753, 108.2532 ──
    var map = L.map('map', {
        center: [15.9753, 108.2532],
        zoom: 15,
        zoomControl: true,
        attributionControl: true,
        preferCanvas: true // Tối ưu hiệu năng WebView JavaFX
    });

    // ── Tile Provider 1: CartoDB Dark Matter ──
    var cartoDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OSM &copy; CARTO',
        subdomains: 'abcd',
        maxZoom: 19,
        minZoom: 4
    });

    // ── Tile Provider 2 (Fallback): OpenStreetMap với CSS Dark Filter ──
    var osmDark = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        className: 'dark-tiles',
        maxZoom: 19,
        minZoom: 4
    });

    // Thêm CartoDark làm lớp chính, nếu lỗi tile tự động nạp OSM
    cartoDark.addTo(map);

    // Xử lý lỗi tile đơn lẻ
    cartoDark.on('tileerror', function(error, tile) {
        // Tự động chuyển lớp sang OSM nếu CartoDB gặp sự cố mạng
        if (!map.hasLayer(osmDark)) {
            map.removeLayer(cartoDark);
            osmDark.addTo(map);
            console.log('[MAP] Switching to backup dark tile provider (OSM)');
        }
    });

    // ── Quản lý Markers & Routes ──
    var markerGroup = L.layerGroup().addTo(map);
    var markers = [];
    var routeLines = [];

    // ═══════════════════════════════════════════════════════════
    //  JS BRIDGE FUNCTIONS (Gọi từ Java Controller)
    // ═══════════════════════════════════════════════════════════

    /**
     * Thêm Marker SOS lên bản đồ khi Base Station nhận tín hiệu.
     */
    function addSOSMarker(lat, lon, nodeId, severity, alertType, message, victimCount) {
        var color, className, badgeClass;
        switch (severity) {
            case 'CRITICAL':
                color = '#FF3B30'; className = 'critical'; badgeClass = 'pulse-marker-sos'; break;
            case 'HIGH':
                color = '#FF9F0A'; className = 'high'; badgeClass = ''; break;
            default:
                color = '#FFD60A'; className = 'medium'; badgeClass = ''; break;
        }

        var icon = '🆘';
        var typeText = 'Cứu hộ khẩn cấp';
        switch (alertType) {
            case 'MEDICAL':
                icon = '🏥'; typeText = 'Cấp cứu Y tế'; break;
            case 'FLOOD_TRAPPED':
                icon = '🌊'; typeText = 'Kẹt do Lũ lụt'; break;
            case 'LANDSLIDE':
                icon = '⛰️'; typeText = 'Sạt lở Đất đá'; break;
        }

        var markerIcon = L.divIcon({
            className: 'custom-marker',
            html: '<div class="' + badgeClass + '" style="'
                + 'background: ' + color + ';'
                + 'width: 38px; height: 38px;'
                + 'border-radius: 50%;'
                + 'display: flex; align-items: center; justify-content: center;'
                + 'font-size: 20px;'
                + 'border: 2.5px solid #FFFFFF;'
                + 'box-shadow: 0 0 20px ' + color + '99;'
                + 'cursor: pointer;'
                + '">' + icon + '</div>',
            iconSize: [38, 38],
            iconAnchor: [19, 19],
            popupAnchor: [0, -22]
        });

        var popupContent = '<div class="sos-popup">'
            + '<h3 class="' + className + '">' + icon + ' ' + severity + ' — ' + typeText + '</h3>'
            + '<div class="info-row"><span class="info-label">Node Gửi</span>'
            + '<span class="info-value">' + nodeId + '</span></div>'
            + '<div class="info-row"><span class="info-label">Số Nạn Nhân</span>'
            + '<span class="info-value" style="color:' + color + ';">' + victimCount + ' người</span></div>'
            + '<div class="info-row"><span class="info-label">Tọa Độ GPS</span>'
            + '<span class="info-value">' + lat.toFixed(4) + ', ' + lon.toFixed(4) + '</span></div>'
            + '<div style="margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.08); color:#E5E5EA; font-size:12.5px; font-style:italic;">'
            + '“' + (message || 'Cần hỗ trợ khẩn cấp!') + '”'
            + '</div>'
            + '</div>';

        var marker = L.marker([lat, lon], { icon: markerIcon })
            .bindPopup(popupContent, { maxWidth: 300 })
            .addTo(markerGroup);

        markers.push(marker);

        // Zoom mượt mà đến vị trí nạn nhân
        map.flyTo([lat, lon], Math.max(map.getZoom(), 14), {
            animate: true,
            duration: 1.0
        });

        // Tự động mở popup sau khi zoom
        setTimeout(function() {
            marker.openPopup();
        }, 1100);

        return markers.length;
    }

    /**
     * Thêm Marker Base Station cố định
     */
    function addBaseStationMarker(lat, lon) {
        var bsIcon = L.divIcon({
            className: 'base-station-marker',
            html: '<div style="'
                + 'background: #0A84FF;'
                + 'width: 42px; height: 42px;'
                + 'border-radius: 50%;'
                + 'display: flex; align-items: center; justify-content: center;'
                + 'font-size: 22px;'
                + 'border: 3px solid #FFFFFF;'
                + 'box-shadow: 0 0 25px rgba(10,132,255,0.8);'
                + '">🏛️</div>',
            iconSize: [42, 42],
            iconAnchor: [21, 21],
            popupAnchor: [0, -24]
        });

        L.marker([lat, lon], { icon: bsIcon })
            .bindPopup('<div class="sos-popup"><h3 style="color:#0A84FF">🏛️ TRẠM CHỈ HUY TRUNG TÂM</h3>'
                + '<div class="info-row"><span class="info-label">Trạng Thái</span><span class="info-value" style="color:#30D158">Sẵn sàng (Port 8888)</span></div>'
                + '<div class="info-row"><span class="info-label">Tọa Độ</span><span class="info-value">' + lat.toFixed(4) + ', ' + lon.toFixed(4) + '</span></div>'
                + '</div>')
            .addTo(markerGroup);
    }

    // Khởi tạo Marker Base Station tại Trung tâm Chỉ huy VKU (15.9753, 108.2532)
    addBaseStationMarker(15.9753, 108.2532);

    console.log('[MAP] Tactical Leaflet Map initialized — Center: VKU Danang (15.9753, 108.2532)');
</script>

</body>
</html>
