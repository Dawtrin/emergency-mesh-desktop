<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#002b36" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#05070b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyanAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with chamfered look -->
  <rect width="512" height="512" rx="64" fill="#05070b"/>
  <rect width="496" height="496" x="8" y="8" rx="56" fill="url(#bgGlow)" stroke="#1a2e3b" stroke-width="3"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6,6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#ffb300" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Radar Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.35"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.35"/>
  
  <!-- Outer Tactical Chamfered Shield -->
  <polygon points="256,48 454,147 454,365 256,464 58,365 58,147" 
           fill="none" stroke="url(#cyanAmberGrad)" stroke-width="5" filter="url(#neonGlow)"/>

  <!-- Tactical Corner Ticks -->
  <path d="M 120,90 L 90,90 L 90,120" fill="none" stroke="#ffb300" stroke-width="4"/>
  <path d="M 392,90 L 422,90 L 422,120" fill="none" stroke="#ffb300" stroke-width="4"/>
  <path d="M 90,392 L 90,422 L 120,422" fill="none" stroke="#ffb300" stroke-width="4"/>
  <path d="M 422,392 L 422,422 L 392,422" fill="none" stroke="#ffb300" stroke-width="4"/>

  <!-- Central Mesh Network Nodes -->
  <!-- Center Node -->
  <circle cx="256" cy="256" r="24" fill="#00e5ff" fill-opacity="0.2" stroke="#00e5ff" stroke-width="3" filter="url(#neonGlow)"/>
  
  <!-- Satellite Nodes -->
  <circle cx="176" cy="186" r="10" fill="#ffb300" stroke="#05070b" stroke-width="2"/>
  <line x1="176" y1="186" x2="256" y2="256" stroke="#ffb300" stroke-width="2.5" stroke-opacity="0.7"/>

  <circle cx="336" cy="186" r="10" fill="#00e5ff" stroke="#05070b" stroke-width="2"/>
  <line x1="336" y1="186" x2="256" y2="256" stroke="#00e5ff" stroke-width="2.5" stroke-opacity="0.7"/>

  <circle cx="176" cy="326" r="10" fill="#00e5ff" stroke="#05070b" stroke-width="2"/>
  <line x1="176" y1="326" x2="256" y2="256" stroke="#00e5ff" stroke-width="2.5" stroke-opacity="0.7"/>

  <circle cx="336" cy="326" r="10" fill="#ff3b30" stroke="#05070b" stroke-width="2"/>
  <line x1="336" y1="326" x2="256" y2="256" stroke="#ff3b30" stroke-width="2.5" stroke-opacity="0.7"/>

  <!-- Inter-satellite links -->
  <line x1="176" y1="186" x2="336" y2="186" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.5"/>
  <line x1="176" y1="326" x2="336" y2="326" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.5"/>

  <!-- Central C2 Monogram -->
  <text x="256" y="270" font-family="'Space Grotesk', monospace, sans-serif" font-weight="900" font-size="34" 
        fill="#ffffff" text-anchor="middle" letter-spacing="2">C2</text>

  <!-- Typography: RESCUE HUD -->
  <text x="256" y="415" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="20" 
        fill="#ffb300" text-anchor="middle" letter-spacing="8">EMERGENCY MESH</text>
  <text x="256" y="438" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" 
        fill="#00e5ff" text-anchor="middle" letter-spacing="5">TACTICAL COMMAND</text>
</svg>
